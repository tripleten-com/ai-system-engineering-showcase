# Sent upstream as the Connection header. A plain request (SSE included) leaves $http_upgrade
# empty and must get `keep-alive`; only a real WebSocket handshake gets `upgrade`. Hardcoding
# `upgrade` announces a protocol switch on every proxied request, which is a malformed hop-by-hop
# header that happens to be tolerated rather than a thing that works. This file is included at
# http level (conf.d/default.conf), which is the only scope where `map` is legal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

server {
    # 8080, not 80: this runs on nginxinc/nginx-unprivileged as uid 101, which cannot bind a
    # privileged port. The published host port is still 3000 — see infra/docker-compose.yml.
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # Docker embedded DNS resolver with 10s TTL
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://incident-agent-api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Both are load-bearing for GET /api/stream. Buffering would hold frames back until a
        # block filled, destroying the only property a stream has; the default 60s read timeout
        # would cut a stream that ever went quiet for a minute.
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # The archived postmortem, same-origin.
    #
    # The execution terminal and the recovery modal both link to the JSON the worker wrote, and that
    # link is resolved by the *visitor's* browser. Pointing it straight at LocalStack meant
    # `http://localhost:4566/...`, which works only when the viewer happens to be on the machine
    # running the stack — on a single-VM deployment, "localhost" is the viewer's laptop and the link
    # is dead. Proxying it here makes the URL relative, so it is correct on localhost, on a VM, and
    # behind a reverse proxy with no build-time configuration at all.
    #
    # Read-only by construction: only GET and HEAD reach it, so this cannot be used to write to or
    # delete from the bucket. It is still an unauthenticated window onto one bucket of a demo
    # emulator, onto a bucket that holds nothing but generated demo postmortems.
    location /s3/ {
        limit_except GET HEAD { deny all; }
        # The rewrite is load-bearing. nginx normally replaces the matched location prefix with the
        # `proxy_pass` URI — but *not* when `proxy_pass` names a variable, which it must here so the
        # container starts before LocalStack resolves. Without it LocalStack received `/s3/<bucket>/…`
        # and answered `200` with an empty body, which is the worst possible failure: the link looked
        # like it worked and downloaded nothing.
        # `set` before `rewrite ... break`, and the order is not stylistic: both run in the rewrite
        # phase, and `break` ends that phase — so a `set` placed after it never executes and
        # `proxy_pass` gets an empty variable, and nginx answers 500 with "invalid URL prefix".
        set $s3_upstream http://localstack:4566;
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass $s3_upstream;
        proxy_set_header Host $host;
        # The worker writes `application/json`; forcing the download makes the link behave like the
        # "download the postmortem" affordance the UI presents rather than dumping JSON into a tab.
        add_header Content-Disposition 'attachment' always;
    }

    location /healthz {
        set $api_upstream http://incident-agent-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
