[project]
name = "remediation-worker"
version = "1.0.0"
description = "TripleTen Cloud Platform — async SQS remediation daemon"
requires-python = ">=3.11,<3.12"
dependencies = [
  "tripleten-contracts",
  "boto3>=1.34.0,<2.0.0",
  "redis>=5.0.3,<6.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
]

[project.scripts]
remediation-worker = "remediation_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remediation_worker"]

[tool.uv.sources]
tripleten-contracts = { workspace = true }
