name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Both services require this with no fallback; the demo value is public by design.
  CALLBACK_SECRET: ci-callback-secret

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # --frozen fails the build on a stale lockfile instead of silently re-resolving.
      - name: Sync workspace from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run poe lint

      # The `typecheck` task has existed since Stage 1 but no job ran it, so nothing stopped a
      # type regression from landing. Gated here rather than left to local discipline.
      - name: Type-check
        run: uv run poe typecheck

      # Via poe, not a copy of the command: the pytest path list is defined once, in
      # [tool.poe.tasks], so a fourth test directory cannot land in one place and not the other.
      # Node is set up after this step, so the frontend half of test-unit runs below.
      - name: Python unit tests
        run: uv run poe test-unit-python

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/incident-war-room/package-lock.json

      - name: Install war room dependencies
        run: npm --prefix services/incident-war-room ci

      - name: War room unit tests
        run: uv run poe test-unit-frontend

      - name: War room type-check & build
        run: npm --prefix services/incident-war-room run build

  contracts-drift:
    name: Generated contracts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Regenerate TypeScript contracts
        run: uv run poe contracts
      - name: Fail if the committed file is stale
        run: git diff --exit-code services/incident-war-room/src/types/contracts.gen.ts

  stack-and-integration:
    name: Stack, smoke & integration
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Provide the environment file
        run: cp .env.example .env

      - name: Start all 9 containers
        run: docker compose up -d --build --wait

      - name: Smoke suite
        run: uv run poe smoke

      - name: Shell smoke validator (bash parity)
        run: bash scripts/smoke-test.sh

      - name: Integration tests
        run: uv run poe test-integration

      # Project 5's central safety claim. Never xfail, never skip, never advisory.
      - name: HITL invariant
        run: uv run pytest -k hitl_gate -m integration -v

      - name: Runtime images ship no test tooling
        run: |
          for svc in incident-agent-api remediation-worker; do
            if docker compose exec -T "$svc" python -c "import pytest" 2>/dev/null; then
              echo "::error::pytest is present in the $svc runtime image"
              exit 1
            fi
          done

      - name: Runtime images run as non-root
        run: |
          for svc in incident-agent-api remediation-worker; do
            user=$(docker compose exec -T "$svc" whoami | tr -d '\r')
            [ "$user" = "appuser" ] || { echo "::error::$svc runs as $user"; exit 1; }
          done

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [stack-and-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
