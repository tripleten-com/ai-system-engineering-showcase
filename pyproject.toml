[project]
name = "tripleten-ai-system-engineering-showcase"
version = "1.0.0"
description = "TripleTen Cloud Platform — Autonomous Incident Defense Showcase"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/contracts",
  "services/incident-agent-api",
  "services/remediation-worker",
]

# Workspace members are only installed into the root venv when something depends on
# them. The root is a meta-package, so it depends on them explicitly — that keeps a
# bare `uv sync` sufficient for tests and CI, with no --all-packages flag to forget.
[tool.uv.sources]
tripleten-contracts = { workspace = true }
incident-agent-api = { workspace = true }
remediation-worker = { workspace = true }

[dependency-groups]
dev = [
  # Workspace members under test
  "tripleten-contracts",
  "incident-agent-api",
  "remediation-worker",
  # Test runners
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  # Smoke-suite dependencies. These are NOT optional: tests/smoke/ imports them
  # directly, and a missing one must fail the run rather than silently skip it.
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.28,<3.0.0",
  "psycopg2-binary>=2.9.9,<3.0.0",
  "boto3>=1.34.0,<2.0.0",
  "redis>=5.0.3,<6.0.0",
  # The provisioning-contract suite parses infra/prometheus/prometheus.yml, the Grafana
  # provisioning YAML, and infra/docker-compose.yml as data. Same reasoning as above: a
  # missing parser must fail the run, not skip the assertions.
  "pyyaml>=6.0.1,<7.0.0",
  # Lint & types
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  # Cross-platform task runner. `make` is not present on the primary (Windows)
  # dev machine; poe runs identically under PowerShell, bash, and CI.
  "poethepoet>=0.29.0",
]

# ==============================================================================
# Task runner — the canonical entrypoint. `make <target>` delegates here.
# ==============================================================================
[tool.poe.tasks]
up = { cmd = "docker-compose up -d", help = "Start all 9 containers" }
down = { cmd = "docker-compose down", help = "Stop the stack" }
logs = { cmd = "docker-compose logs -f", help = "Follow stack logs" }
ps = { cmd = "docker-compose ps", help = "Show container status" }

smoke = { cmd = "pytest tests/smoke -m smoke -v", help = "Post-startup smoke suite (<15s)" }
test-integration = { cmd = "pytest services/incident-agent-api/tests/integration services/remediation-worker/tests/integration -m integration -v", help = "Integration tests; requires the stack up" }
# Node entrypoints run through a shell, not exec: on Windows `npm` and `npx` are `.cmd` shims
# that a bare exec cannot resolve, so a `cmd` task here fails with "program not found".
test-e2e = { shell = "npx playwright test", help = "Playwright browser matrix" }

# test-unit is split into halves so CI can invoke each without restating the command, and still
# set Node up in between. Local use is `test-unit`; nothing should inline these paths a third time.
test-unit-python = { cmd = "pytest packages/contracts/tests services/incident-agent-api/tests/unit services/remediation-worker/tests/unit -v", help = "Python unit tests only" }
test-unit-frontend = { shell = "npm --prefix services/incident-war-room run test", help = "War room unit tests only" }

lint = { cmd = "ruff check .", help = "Lint" }
fmt = { cmd = "ruff format .", help = "Format" }
typecheck = { cmd = "mypy services/incident-agent-api/src services/remediation-worker/src", help = "Type-check" }
lock = { cmd = "uv lock", help = "Refresh uv.lock" }
contracts = { cmd = "python packages/contracts/scripts/export_typescript.py services/incident-war-room/src/types/contracts.gen.ts", help = "Regenerate the war room TypeScript contracts" }

[tool.poe.tasks.test-unit]
help = "Fast unit tests (Python + frontend)"
sequence = ["test-unit-python", "test-unit-frontend"]

[tool.poe.tasks.test]
help = "Everything, in gate order"
sequence = ["test-unit", "test-integration", "smoke", "test-e2e"]

# ==============================================================================
# Tooling configuration
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests", "packages/contracts/tests", "services/incident-agent-api/tests", "services/remediation-worker/tests"]
asyncio_mode = "auto"
# --import-mode=importlib: with a src layout and no tests/__init__.py, two services
# both containing tests/conftest.py would otherwise collide on the module name.
addopts = "-m 'not integration and not smoke' --import-mode=importlib"
markers = [
  "unit: Unit tests",
  "integration: Integration tests requiring live services",
  "smoke: Smoke tests for container health and readiness",
  "e2e: End-to-end test suites",
  # Deliberately long. The 31-second AWAITING_APPROVAL hold in the HITL suite is the test
  # that proves no timeout auto-approves, so it is marked rather than shortened.
  "slow: Tests whose duration is the assertion",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.gen.ts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = [
  "tripleten_contracts",
  "incident_agent_api",
  "remediation_worker",
]

[tool.ruff.lint.per-file-ignores]
# The runbook `content` strings are the deliverable, not prose to be reflowed.
# Wrapping them would change the seeded text.
"services/incident-agent-api/src/incident_agent_api/seed/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
