[project]
name = "tripleten-contracts"
version = "1.0.0"
description = "Canonical cross-service identifiers and schemas for the TripleTen incident demo"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.6.0,<3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripleten_contracts"]
